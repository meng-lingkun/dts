limit_req_zone $binary_remote_addr zone=dts_login:1m rate=30r/m;

# Docker can assign a new address to Server while Web continues running.
upstream dts_api {
  zone dts_api 64k;
  resolver 127.0.0.11 valid=3s ipv6=off;
  resolver_timeout 2s;
  server server:8080 resolve;
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  location = /api/v1/auth/login {
    limit_req zone=dts_login burst=12 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    proxy_pass http://dts_api;
  }
  location = /readyz { proxy_pass http://dts_api; }
  location /api/ { proxy_pass http://dts_api; }
  location /metrics { proxy_pass http://dts_api/metrics; }
  location / { try_files $uri $uri/ /index.html; }
}
