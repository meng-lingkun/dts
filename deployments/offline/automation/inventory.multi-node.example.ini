[control_plane]
control1 ansible_host=192.168.10.10

[registry]
control1

[workers]
worker1 ansible_host=192.168.10.11
worker2 ansible_host=192.168.10.12

[nodes:children]
control_plane
registry
workers

[all:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
dts_remote_install_dir=/opt/dts-offline
dts_single_node_local_storage=false
dts_server_replicas=2
dts_worker_replicas=3
dts_web_replicas=2
dts_hpa_max_replicas=50
dts_install_application=true
dts_rwx_storage_class=
