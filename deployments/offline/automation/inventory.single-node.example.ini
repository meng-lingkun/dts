[control_plane]
dts1 ansible_host=192.168.10.10 ansible_connection=local

[registry]
dts1

# Keep this group empty in single-node mode. The installer removes the control-plane
# scheduling taint so DTS workloads can run on dts1.
[workers]

[nodes:children]
control_plane
registry
workers

[all:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
dts_remote_install_dir=/opt/dts-offline
dts_single_node_local_storage=true
dts_single_node_storage_dir=/var/lib/dts-single-node
dts_single_node_postgres_storage_size=50Gi
dts_spool_storage_size=200Gi
dts_server_replicas=1
dts_worker_replicas=1
dts_web_replicas=1
dts_hpa_max_replicas=1
dts_install_application=true
dts_rwx_storage_class=
