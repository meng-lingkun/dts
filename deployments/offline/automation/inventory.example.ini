[control_plane]
control1 ansible_host=192.168.10.10

[registry]
control1

[workers]
worker1 ansible_host=192.168.10.11
worker2 ansible_host=192.168.10.12

[nodes:children]
control_plane
registry
workers

[all:vars]
ansible_user=root
ansible_python_interpreter=/usr/bin/python3
# Dedicated directory synchronized to every target node. The full uninstall removes it.
dts_remote_install_dir=/opt/dts-offline
dts_single_node_local_storage=false
dts_server_replicas=2
dts_worker_replicas=3
dts_web_replicas=2
dts_hpa_max_replicas=50
# Configure SSH keys and known_hosts before running. Do not store passwords here.
# false installs the cluster only; true also installs DTS (requires RWO/RWX storage).
dts_install_application=true
dts_rwx_storage_class=
