services:
  postgres:
    image: qmigration/postgres:17
    environment:
      POSTGRES_USER: qmigration
      POSTGRES_PASSWORD: ${QMIGRATION_METADATA_PASSWORD:?missing QMIGRATION_METADATA_PASSWORD}
      POSTGRES_DB: qmigration
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qmigration"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  server:
    image: qmigration/server:${QMIGRATION_VERSION:?missing QMIGRATION_VERSION}
    environment:
      QMIGRATION_REPOSITORY: postgres
      QMIGRATION_PRODUCTION: "true"
      QMIGRATION_AUTH_REQUIRED: "true"
      QMIGRATION_METADATA_HOST: postgres
      QMIGRATION_METADATA_USER: qmigration
      QMIGRATION_METADATA_PASSWORD: ${QMIGRATION_METADATA_PASSWORD}
      QMIGRATION_METADATA_DATABASE: qmigration
      QMIGRATION_MASTER_KEY: ${QMIGRATION_MASTER_KEY:?missing QMIGRATION_MASTER_KEY}
      QMIGRATION_WORKER_TOKEN: ${QMIGRATION_WORKER_TOKEN:?missing QMIGRATION_WORKER_TOKEN}
      QMIGRATION_AUTH_SECRET: ${QMIGRATION_AUTH_SECRET:?missing QMIGRATION_AUTH_SECRET}
      QMIGRATION_BOOTSTRAP_ADMIN_USER: ${QMIGRATION_BOOTSTRAP_ADMIN_USER:-admin}
      QMIGRATION_BOOTSTRAP_ADMIN_PASSWORD: ${QMIGRATION_BOOTSTRAP_ADMIN_PASSWORD:-}
      QMIGRATION_CORS_ORIGIN: ${QMIGRATION_CORS_ORIGIN:-http://127.0.0.1:8088}
      QMIGRATION_CDC_SPOOL_STORAGE: file
      QMIGRATION_CDC_SPOOL_DIR: /var/lib/qmigration/cdc-spool
      QMIGRATION_CDC_SPOOL_DISK_WARN_PCT: ${QMIGRATION_CDC_SPOOL_DISK_WARN_PCT:-80}
      QMIGRATION_CDC_SPOOL_DISK_CRITICAL_PCT: ${QMIGRATION_CDC_SPOOL_DISK_CRITICAL_PCT:-90}
      QMIGRATION_VALIDATION_STABLE_WINDOW_SECONDS: ${QMIGRATION_VALIDATION_STABLE_WINDOW_SECONDS:-2}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - cdcspool:/var/lib/qmigration/cdc-spool
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    image: qmigration/server:${QMIGRATION_VERSION:?missing QMIGRATION_VERSION}
    entrypoint: ["/usr/local/bin/qmigration-worker"]
    environment:
      QMIGRATION_SERVER: http://server:8080
      QMIGRATION_WORKER_TOKEN: ${QMIGRATION_WORKER_TOKEN}
      QMIGRATION_WORKER_CONCURRENCY: ${QMIGRATION_WORKER_CONCURRENCY:-4}
      QMIGRATION_WORKER_SHUTDOWN_GRACE_SECONDS: ${QMIGRATION_WORKER_SHUTDOWN_GRACE_SECONDS:-30}
    depends_on:
      server:
        condition: service_healthy
    stop_grace_period: 45s
    restart: unless-stopped

  web:
    image: qmigration/web:${QMIGRATION_VERSION:?missing QMIGRATION_VERSION}
    depends_on:
      server:
        condition: service_healthy
    ports: ["127.0.0.1:8088:8080"]
    restart: unless-stopped

volumes:
  pgdata:
  cdcspool:
