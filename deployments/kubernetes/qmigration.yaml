apiVersion: v1
kind: Namespace
metadata:
  name: qmigration
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qmigration-config
  namespace: qmigration
data:
  QMIGRATION_REPOSITORY: postgres
  QMIGRATION_PRODUCTION: "true"
  QMIGRATION_METADATA_HOST: postgres.qmigration.svc
  QMIGRATION_METADATA_PORT: "5432"
  QMIGRATION_METADATA_USER: qmigration
  QMIGRATION_METADATA_DATABASE: qmigration
  QMIGRATION_AUTH_REQUIRED: "true"
  # The offline installer overrides this value when QMIGRATION_CORS_ORIGIN is set.
  QMIGRATION_CORS_ORIGIN: http://127.0.0.1:8088
  QMIGRATION_DB_PRESSURE_SAMPLE_SECONDS: "5"
  QMIGRATION_WORKER_MAX_CPU_PCT: "95"
  QMIGRATION_WORKER_MAX_MEMORY_PCT: "95"
  QMIGRATION_CDC_SPOOL_STORAGE: file
  QMIGRATION_CDC_SPOOL_DIR: /var/lib/qmigration/cdc-spool
  QMIGRATION_CDC_SPOOL_DISK_WARN_PCT: "80"
  QMIGRATION_CDC_SPOOL_DISK_CRITICAL_PCT: "90"
  QMIGRATION_VALIDATION_STABLE_WINDOW_SECONDS: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: qmigration
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: qmigration-server}
  template:
    metadata:
      labels: {app: qmigration-server}
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: {app: qmigration-server}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app: qmigration-server}
      containers:
      - name: server
        image: qmigration/server:0.15.0-rc49
        imagePullPolicy: Never
        envFrom: [{configMapRef: {name: qmigration-config}}]
        env:
        - name: QMIGRATION_METADATA_PASSWORD
          valueFrom: {secretKeyRef: {name: qmigration-secrets, key: metadata-password}}
        - name: QMIGRATION_MASTER_KEY
          valueFrom: {secretKeyRef: {name: qmigration-secrets, key: master-key}}
        - name: QMIGRATION_WORKER_TOKEN
          valueFrom: {secretKeyRef: {name: qmigration-secrets, key: worker-token}}
        - name: QMIGRATION_AUTH_SECRET
          valueFrom: {secretKeyRef: {name: qmigration-secrets, key: auth-secret}}
        - name: QMIGRATION_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom: {secretKeyRef: {name: qmigration-secrets, key: bootstrap-admin-password}}
        ports: [{containerPort: 8080, name: http}]
        readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 3, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15, periodSeconds: 10}
        resources:
          requests: {cpu: "250m", memory: "256Mi"}
          limits: {cpu: "2", memory: "2Gi"}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        volumeMounts:
        - {name: cdc-spool, mountPath: /var/lib/qmigration/cdc-spool}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: cdc-spool
        persistentVolumeClaim: {claimName: qmigration-cdc-spool}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: qmigration
spec:
  selector: {app: qmigration-server}
  ports: [{port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: server
  namespace: qmigration
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: qmigration-server}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: qmigration
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  selector:
    matchLabels: {app: qmigration-worker}
  template:
    metadata:
      labels: {app: qmigration-worker}
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: {app: qmigration-worker}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app: qmigration-worker}
      containers:
      - name: worker
        image: qmigration/server:0.15.0-rc49
        imagePullPolicy: Never
        command: ["/usr/local/bin/qmigration-worker"]
        env:
        - {name: QMIGRATION_SERVER, value: "http://server.qmigration.svc:8080"}
        - {name: QMIGRATION_WORKER_CONCURRENCY, value: "4"}
        - {name: QMIGRATION_WORKER_SHUTDOWN_GRACE_SECONDS, value: "30"}
        - {name: QMIGRATION_WORKER_LABELS, value: "network=kubernetes"}
        - name: QMIGRATION_WORKER_TOKEN
          valueFrom: {secretKeyRef: {name: qmigration-secrets, key: worker-token}}
        resources:
          requests: {cpu: "1", memory: "1Gi"}
          limits: {cpu: "4", memory: "4Gi"}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
  namespace: qmigration
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: qmigration-worker}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  namespace: qmigration
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: worker}
  minReplicas: 3
  maxReplicas: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 70}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: qmigration
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: qmigration-web}
  template:
    metadata:
      labels: {app: qmigration-web}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: {app: qmigration-web}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: {app: qmigration-web}
      containers:
      - name: web
        image: qmigration/web:0.15.0-rc49
        imagePullPolicy: Never
        ports: [{containerPort: 8080, name: http}]
        readinessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 3, periodSeconds: 10}
        resources:
          requests: {cpu: "50m", memory: "64Mi"}
          limits: {cpu: "500m", memory: "256Mi"}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
        volumeMounts:
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: qmigration
spec:
  selector: {app: qmigration-web}
  ports: [{port: 80, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: qmigration
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: qmigration-web}
