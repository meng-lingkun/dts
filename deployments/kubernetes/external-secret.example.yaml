apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dts-secrets
  namespace: dts
spec:
  # Master-key changes require coordinated re-encryption of retained data.
  refreshPolicy: CreatedOnce
  secretStoreRef: {kind: SecretStore, name: dts-secret-store}
  target: {name: dts-secrets, creationPolicy: Owner}
  data:
  - secretKey: metadata-password
    remoteRef: {key: dts/metadata-password}
  - secretKey: master-key
    remoteRef: {key: dts/master-key}
  - secretKey: worker-token
    remoteRef: {key: dts/worker-token}
  - secretKey: auth-secret
    remoteRef: {key: dts/auth-secret}
  - secretKey: bootstrap-admin-password
    remoteRef: {key: dts/bootstrap-admin-password}
