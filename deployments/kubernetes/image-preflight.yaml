apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: image-preflight
  namespace: qmigration
spec:
  selector:
    matchLabels: {app: qmigration-image-preflight}
  template:
    metadata:
      labels: {app: qmigration-image-preflight}
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: web-image
        image: qmigration/web:0.15.0-rc49
        imagePullPolicy: Never
        command: ["/bin/sh", "-c", "true"]
      - name: postgres-image
        image: qmigration/postgres:17
        imagePullPolicy: Never
        command: ["/bin/sh", "-c", "true"]
      containers:
      - name: server-image
        image: qmigration/server:0.15.0-rc49
        imagePullPolicy: Never
        command: ["/bin/sh", "-c", "sleep 3600"]
        resources:
          requests: {cpu: "5m", memory: "8Mi"}
          limits: {cpu: "50m", memory: "32Mi"}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
