groups:
- name: dts
  rules:
  - alert: DTSTaskFailed
    expr: dts_migrations_failed > 0
    for: 1m
    labels: {severity: critical}
    annotations: {summary: "DTS has failed migration tasks"}
  - alert: DTSCDCBacklog
    expr: dts_cdc_lag_seconds > 30
    for: 5m
    labels: {severity: warning}
    annotations: {summary: "DTS CDC lag exceeds 30 seconds"}
  - alert: DTSWorkerHighCPU
    expr: dts_worker_cpu_usage_percent > 90
    for: 10m
    labels: {severity: warning}
    annotations: {summary: "DTS worker CPU is above 90%"}
  - alert: DTSValidationMismatch
    expr: dts_validation_mismatch_total > 0
    for: 1m
    labels: {severity: critical}
    annotations: {summary: "DTS validation mismatch detected"}
  - alert: DTSCDCSpoolDiskHigh
    expr: dts_cdc_spool_storage_used_pct >= 80
    for: 5m
    labels: {severity: warning}
    annotations: {summary: "DTS CDC spool filesystem usage is above 80%"}
  - alert: DTSCDCSpoolDiskCritical
    expr: dts_cdc_spool_storage_used_pct >= 90
    for: 1m
    labels: {severity: critical}
    annotations: {summary: "DTS CDC spool filesystem usage is above 90%; source CDC ACK can be backpressured"}
  - alert: DTSCDCSpoolCriticalETA
    expr: dts_cdc_spool_critical_eta_seconds > 0 and dts_cdc_spool_critical_eta_seconds <= 300
    for: 1m
    labels: {severity: critical}
    annotations: {summary: "DTS CDC spool is projected to hit the critical backlog boundary within 5 minutes"}
  - alert: DTSCDCSpoolGrowingFast
    expr: dts_cdc_spool_growth_bytes_per_second > 104857600
    for: 5m
    labels: {severity: warning}
    annotations: {summary: "DTS CDC spool backlog is growing faster than 100 MiB/s"}

  - alert: DTSThroughputTargetUnderRun
    expr: dts_task_target_throughput_bytes_per_second > 0 and dts_task_throughput_target_utilization_ratio < 0.5 and dts_task_progress < 100
    for: 15m
    labels: {severity: warning}
    annotations: {summary: "DTS sustained throughput is below 50% of the configured task target for 15 minutes"}

  - alert: DTSCompletionSLARisk
    expr: dts_task_completion_sla_remaining_seconds > 0 and dts_task_sla_p95_eta_seconds > dts_task_completion_sla_remaining_seconds and dts_task_progress < 100
    for: 10m
    labels: {severity: warning}
    annotations: {summary: "DTS P95 tail-adjusted ETA is outside the configured completion SLA"}

  - alert: DTSCompletionSLACriticalRisk
    expr: dts_task_completion_sla_remaining_seconds > 0 and dts_task_sla_p99_eta_seconds > dts_task_completion_sla_remaining_seconds and dts_task_progress < 100
    for: 5m
    labels: {severity: critical}
    annotations: {summary: "DTS P99 tail-adjusted ETA is outside the configured completion SLA"}
