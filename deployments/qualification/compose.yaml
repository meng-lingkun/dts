name: dts-qualification
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dts
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: dts_e2e
    command: ["--server-id=101", "--log-bin=mysql-bin", "--gtid-mode=ON", "--enforce-gtid-consistency=ON", "--binlog-format=ROW", "--binlog-row-image=FULL"]
    ports: ["127.0.0.1:13306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  postgres:
    image: postgres:${DTS_QUAL_POSTGRES_MAJOR:-16}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dts
      POSTGRES_DB: dts
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=20", "-c", "max_wal_senders=20", "-c", "max_prepared_transactions=10"]
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dts"]
      interval: 5s
      timeout: 5s
      retries: 30
