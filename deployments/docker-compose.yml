services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: qmigration
      POSTGRES_PASSWORD: ${QMIGRATION_METADATA_PASSWORD:?set QMIGRATION_METADATA_PASSWORD in a private env file}
      POSTGRES_DB: qmigration
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qmigration"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.backend
    environment:
      QMIGRATION_REPOSITORY: postgres
      QMIGRATION_PRODUCTION: "true"
      QMIGRATION_AUTH_REQUIRED: "true"
      QMIGRATION_METADATA_HOST: postgres
      QMIGRATION_METADATA_USER: qmigration
      QMIGRATION_METADATA_PASSWORD: ${QMIGRATION_METADATA_PASSWORD:?set QMIGRATION_METADATA_PASSWORD}
      QMIGRATION_METADATA_DATABASE: qmigration
      QMIGRATION_MASTER_KEY: ${QMIGRATION_MASTER_KEY:?set a random QMIGRATION_MASTER_KEY}
      QMIGRATION_WORKER_TOKEN: ${QMIGRATION_WORKER_TOKEN:?set a random QMIGRATION_WORKER_TOKEN}
      QMIGRATION_AUTH_SECRET: ${QMIGRATION_AUTH_SECRET:?set a random QMIGRATION_AUTH_SECRET}
      QMIGRATION_BOOTSTRAP_ADMIN_USER: ${QMIGRATION_BOOTSTRAP_ADMIN_USER:-admin}
      QMIGRATION_BOOTSTRAP_ADMIN_PASSWORD: ${QMIGRATION_BOOTSTRAP_ADMIN_PASSWORD:?set the initial admin password}
      QMIGRATION_CORS_ORIGIN: ${QMIGRATION_CORS_ORIGIN:-http://127.0.0.1:8088}
      QMIGRATION_CDC_SPOOL_STORAGE: file
      QMIGRATION_CDC_SPOOL_DIR: /var/lib/qmigration/cdc-spool
      QMIGRATION_CDC_SPOOL_DISK_WARN_PCT: ${QMIGRATION_CDC_SPOOL_DISK_WARN_PCT:-80}
      QMIGRATION_CDC_SPOOL_DISK_CRITICAL_PCT: ${QMIGRATION_CDC_SPOOL_DISK_CRITICAL_PCT:-90}
      QMIGRATION_VALIDATION_STABLE_WINDOW_SECONDS: ${QMIGRATION_VALIDATION_STABLE_WINDOW_SECONDS:-2}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - cdcspool:/var/lib/qmigration/cdc-spool
    stop_grace_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.backend
    entrypoint: ["/usr/local/bin/qmigration-worker"]
    environment:
      QMIGRATION_SERVER: http://server:8080
      QMIGRATION_WORKER_TOKEN: ${QMIGRATION_WORKER_TOKEN:?set the same random QMIGRATION_WORKER_TOKEN used by server}
      QMIGRATION_WORKER_CONCURRENCY: ${QMIGRATION_WORKER_CONCURRENCY:-4}
      QMIGRATION_WORKER_SHUTDOWN_GRACE_SECONDS: ${QMIGRATION_WORKER_SHUTDOWN_GRACE_SECONDS:-30}
    depends_on:
      server:
        condition: service_healthy
    stop_grace_period: 45s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.web
    depends_on: [server]
    ports: ["127.0.0.1:8088:8080"]
    restart: unless-stopped

volumes:
  pgdata:
  cdcspool:
