route:
  receiver: operations
  group_by: [alertname, task_id]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
  - matchers: ['severity="critical"']
    receiver: on-call
    repeat_interval: 30m
receivers:
- name: operations
  webhook_configs:
  - url_file: /run/secrets/dts-operations-webhook
    send_resolved: true
- name: on-call
  webhook_configs:
  - url_file: /run/secrets/dts-oncall-webhook
    send_resolved: true
