name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-version.mjs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: backend/go.mod
      - run: go test ./...
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - run: go run ./cmd/openapi-gen -check
        working-directory: backend
      - run: go build ./cmd/server ./cmd/worker ./cmd/dtsctl
        working-directory: backend
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - run: govulncheck ./...
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - run: go build -o "$RUNNER_TEMP/dts-browser-server" ./cmd/server
        working-directory: backend
      - run: npm ci --no-audit --no-fund
        working-directory: deployments/qualification/browser
      - run: DTS_E2E_SERVER_BINARY="$RUNNER_TEMP/dts-browser-server" npm test
        working-directory: deployments/qualification/browser

  backend-race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: backend/go.mod
      - run: go test -race -timeout 10m ./...
        working-directory: backend
        env:
          CGO_ENABLED: '1'

  metadata-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dts-ci-only-password
          POSTGRES_DB: dts_metadata_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dts_metadata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: backend/go.mod
      - run: go test -race -tags integration ./internal/repository/postgres -run '^TestMetadataCDCExecutionPostgres$' -count=1 -timeout 2m
        working-directory: backend
        env:
          CGO_ENABLED: '1'
          DTS_TEST_POSTGRES_HOST: 127.0.0.1
          DTS_TEST_POSTGRES_PORT: '5432'
          DTS_TEST_POSTGRES_USER: postgres
          DTS_TEST_POSTGRES_PASSWORD: dts-ci-only-password
          DTS_TEST_POSTGRES_DATABASE: dts_metadata_test
      - run: sh deployments/qualification/test-recovery-postgres.sh
        env:
          DTS_E2E_ISOLATED: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: dts-ci-only-password

  native-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        postgres: ['16', '17']
    env:
      DTS_QUAL_POSTGRES_MAJOR: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: backend/go.mod
      - run: docker compose -f deployments/qualification/compose.yaml up -d --wait --wait-timeout 180
      - run: bash deployments/qualification/run-native.sh
        env:
          DTS_E2E_CONTROL_PROCESSES: '1'
      - run: DTS_SOAK_SECONDS=20 bash deployments/qualification/run-continuous-cdc.sh
      - if: always()
        run: docker compose -f deployments/qualification/compose.yaml logs --no-color
      - if: always()
        run: docker compose -f deployments/qualification/compose.yaml down --volumes

  offline-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/test-kubernetes-lifecycle.sh
      - run: sh deployments/qualification/test-recovery-set.sh
      - run: sh deployments/qualification/test-compose-lifecycle.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: tools/offline-image-builder/go.sum
      - run: go test ./...
        working-directory: tools/offline-image-builder
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - run: govulncheck ./...
        working-directory: tools/offline-image-builder
      - run: go test ./... && govulncheck ./...
        working-directory: tools/dbstack-inspector
      - run: |
          for script in deployments/offline/*.sh; do
            sh -n "$script" || exit 1
          done
      - run: '! grep -U $''\r'' deployments/offline/*.sh deployments/offline/runtime/versions.env'

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: sh deployments/qualification/run-compose-smoke.sh
        env:
          DTS_E2E_ISOLATED: '1'
