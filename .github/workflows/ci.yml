name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-version.mjs

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: backend/go.mod
      - run: go test ./...
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - run: go build ./cmd/server ./cmd/worker ./cmd/dtsctl
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web

  offline-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/test-kubernetes-lifecycle.sh
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: tools/offline-image-builder/go.sum
      - run: go test ./...
        working-directory: tools/offline-image-builder
      - run: |
          for script in deployments/offline/*.sh; do
            sh -n "$script" || exit 1
          done
      - run: '! grep -U $''\r'' deployments/offline/*.sh deployments/offline/runtime/versions.env'

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: deployments/Dockerfile.backend
          - name: web
            dockerfile: deployments/Dockerfile.web
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file "${{ matrix.dockerfile }}" --tag "dts/${{ matrix.name }}:ci" .
